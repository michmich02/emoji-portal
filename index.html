<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Gesture Canvas — Anime Portal</title>
  <meta name="description" content="Interactive AR gesture-driven canvas demo with real-time hand tracking and anime transformation">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading hand tracking model…</p>
  </div>

  <!-- Hidden video element for webcam feed -->
  <video id="webcam" playsinline autoplay></video>

  <!-- Main rendering canvas -->
  <canvas id="arCanvas"></canvas>

  <!-- UI overlay -->
  <div id="ui-overlay">
    <!-- Status badge (top-left) -->
    <div id="status-badge">
      <span id="status-dot" class="idle"></span>
      <span id="status-text">Idle</span>
    </div>

    <!-- Instruction (bottom-center) -->
    <div id="instruction">Pinch with both hands and pull apart</div>
  </div>

  <!-- Control buttons (top-right) -->
  <div id="controls">
    <!-- Upload anime image -->
    <button id="btn-upload" class="ctrl-btn" title="Upload anime image">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </button>
    <!-- Toggle hand landmarks -->
    <button id="btn-landmarks" class="ctrl-btn" title="Toggle landmarks">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1"/>
        <circle cx="6" cy="6" r="1"/>
        <circle cx="18" cy="6" r="1"/>
        <circle cx="6" cy="18" r="1"/>
        <circle cx="18" cy="18" r="1"/>
        <line x1="6" y1="6" x2="12" y2="12"/>
        <line x1="18" y1="6" x2="12" y2="12"/>
        <line x1="6" y1="18" x2="12" y2="12"/>
        <line x1="18" y1="18" x2="12" y2="12"/>
      </svg>
    </button>
    <!-- Reset -->
    <button id="btn-reset" class="ctrl-btn" title="Reset">
      <svg viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </div>

  <!-- Style Selection Panel (Right side) -->
  <div id="style-panel" class="open">
    <div class="panel-header" id="panel-header">
      <span class="panel-title">Style Matrix</span>
      <button id="toggle-panel" title="Toggle panel">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="style-list">
      <div class="style-item active" data-style="ascii">
        <span class="style-icon" style="background: #000; color: #0f0; font-family: monospace; text-align: center; line-height: 24px; font-size: 14px;">@</span>
        <span class="style-name">ASCII Art</span>
      </div>
      <div class="style-item" data-style="ink">
        <span class="style-icon" style="background: radial-gradient(circle, #222 0%, #eee 100%);"></span>
        <span class="style-name">Ink Wash</span>
      </div>
      <div class="style-item" data-style="mosaic">
        <span class="style-icon" style="background: conic-gradient(#f00 25%, #0f0 0 50%, #00f 0 75%, #ff0 0); background-size: 12px 12px;"></span>
        <span class="style-name">Mosaic</span>
      </div>
      <div class="style-item" data-style="glitch">
        <span class="style-icon" style="background: repeating-linear-gradient(0deg, #f00, #0ff 3px); filter: contrast(2);"></span>
        <span class="style-name">Glitch</span>
      </div>
      <div class="style-item" data-style="halftone">
        <span class="style-icon" style="background: radial-gradient(circle, #000 30%, transparent 35%); background-size: 8px 8px; background-color: #fff;"></span>
        <span class="style-name">Halftone</span>
      </div>
      <div class="style-item" data-style="pencil">
        <span class="style-icon" style="background: repeating-linear-gradient(45deg, #ccc, #ccc 1px, #eee 1px, #eee 4px);"></span>
        <span class="style-name">Pencil Sketch</span>
      </div>
      <div class="style-item" data-style="popart">
        <span class="style-icon" style="background: linear-gradient(45deg, #ff007f 50%, #00ffff 50%);"></span>
        <span class="style-name">Pop Art</span>
      </div>
      <div class="style-item" data-style="emoji">
        <span class="style-icon" style="background: #111; color: #fff; font-size: 14px; text-align: center; line-height: 24px;">🌓</span>
        <span class="style-name">Emoji Art</span>
      </div>
      <div class="style-item" data-style="dice">
        <span class="style-icon" style="background: #eee; color: #111; font-size: 14px; text-align: center; line-height: 24px;">⚃</span>
        <span class="style-name">Dice Art</span>
      </div>
      <div class="style-item" data-style="heart">
        <span class="style-icon" style="background: #111; color: #fff; font-size: 14px; text-align: center; line-height: 24px;">💖</span>
        <span class="style-name">Heart Vibe</span>
      </div>
      <div class="style-item" data-style="blocks">
        <span class="style-icon" style="background: #000; color: #0f0; font-size: 14px; text-align: center; line-height: 24px;">▓</span>
        <span class="style-name">Terminal Blocks</span>
      </div>
      <div class="style-item" data-style="flower">
        <span class="style-icon" style="background: #111; color: #fff; font-size: 14px; text-align: center; line-height: 24px;">🌸</span>
        <span class="style-name">Flower Bloom</span>
      </div>
      <div class="style-item" data-style="pointcloud">
        <span class="style-icon" style="background: #050510; display: flex; align-items: center; justify-content: center;"><span style="width:4px;height:4px;border-radius:50%;background:#0ff;box-shadow: 4px 4px 0 #fff, -4px -4px 0 #00f;"></span></span>
        <span class="style-name">Point Cloud</span>
      </div>
      <div class="style-item" data-style="crt">
        <span class="style-icon" style="background: repeating-linear-gradient(90deg, #f00 0, #f00 1px, #0f0 1px, #0f0 2px, #00f 2px, #00f 3px);"></span>
        <span class="style-name">CRT Phosphor</span>
      </div>
      <div class="style-item" data-style="kaleidoscope">
        <span class="style-icon" style="background: conic-gradient(from 0deg, #ff0 0deg 60deg, #f0f 60deg 120deg, #0ff 120deg 180deg, #ff0 180deg 240deg, #f0f 240deg 300deg, #0ff 300deg 360deg);"></span>
        <span class="style-name">Kaleidoscope</span>
      </div>
    </div>
    
    <div class="panel-actions" style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px;">
      <button id="btn-undo" style="flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: white; cursor: pointer;">Undo Pin</button>
      <button id="btn-clear" style="flex: 1; padding: 10px; background: rgba(255,100,100,0.2); border: none; border-radius: 8px; color: #ff9999; cursor: pointer;">Clear All</button>
    </div>
  </div>

  <button id="toggle-panel-btn" title="Open styles">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </button>

  <!-- Hidden file picker -->
  <input type="file" id="file-input" accept="image/*">

  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Application logic -->
  <script src="app.js"></script>
</body>
</html>
